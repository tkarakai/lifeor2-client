name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      target_sha:
        description: "Git SHA to rollback to (must have been previously deployed)"
        required: true
        type: string
      confirm:
        description: "Type 'rollback-staging' or 'rollback-production' to confirm"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ─── Validate inputs ─────────────────────────────────────────────
  validate:
    name: Validate Rollback
    runs-on: ubuntu-latest
    outputs:
      vercel-env: ${{ steps.env.outputs.vercel-env }}
      project-id-web: ${{ steps.projects.outputs.web }}
      project-id-admin: ${{ steps.projects.outputs.admin }}
      project-id-landing: ${{ steps.projects.outputs.landing }}
    steps:
      - name: Verify confirmation string
        if: inputs.confirm != format('rollback-{0}', inputs.environment)
        run: |
          echo "::error::Confirmation failed. Type 'rollback-${{ inputs.environment }}' to confirm."
          exit 1

      - name: Verify previous deployment exists
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = '${{ inputs.target_sha }}';
            const env = '${{ inputs.environment }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // For production rollback, check production tags
            // For staging rollback, check staging tags
            const tagPrefix = `tags/deploy/${env}/`;

            try {
              const { data: tags } = await github.rest.git.listMatchingRefs({
                owner,
                repo,
                ref: tagPrefix,
              });

              const found = tags.find(tag => tag.ref.includes(sha));
              if (!found) {
                core.warning(`No ${env} deployment tag found for SHA ${sha}. Proceeding with rebuild.`);
              } else {
                console.log(`Found deployment tag: ${found.ref}`);
              }
            } catch (error) {
              core.warning(`Could not verify deployment tag: ${error.message}`);
            }

      - name: Set Vercel environment
        id: env
        run: |
          echo "vercel-env=production" >> "$GITHUB_OUTPUT"

      - name: Resolve Vercel project IDs
        id: projects
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            web="${{ secrets.VERCEL_PROJECT_ID_WEB_STAGING }}"
            admin="${{ secrets.VERCEL_PROJECT_ID_ADMIN_STAGING }}"
            landing="${{ secrets.VERCEL_PROJECT_ID_LANDING_STAGING }}"
          else
            web="${{ secrets.VERCEL_PROJECT_ID_WEB }}"
            admin="${{ secrets.VERCEL_PROJECT_ID_ADMIN }}"
            landing="${{ secrets.VERCEL_PROJECT_ID_LANDING }}"
          fi

          for name in web admin landing; do
            val=$(eval echo \$$name)
            if [ -z "$val" ]; then
              echo "::error::Missing Vercel project ID for $name in ${{ inputs.environment }} environment"
              exit 1
            fi
          done

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"

  # ─── Rebuild and redeploy ────────────────────────────────────────
  build-web:
    name: Build Web (Rollback)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        with:
          app: web
          environment: ${{ needs.validate.outputs.vercel-env }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-web }}

  build-admin:
    name: Build Admin (Rollback)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        with:
          app: admin
          environment: ${{ needs.validate.outputs.vercel-env }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-admin }}

  build-landing:
    name: Build Landing (Rollback)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/build-app
        with:
          app: landing
          environment: ${{ needs.validate.outputs.vercel-env }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-landing }}

  # ─── Deploy Convex (rollback functions) ──────────────────────────
  deploy-convex:
    name: Deploy Convex (Rollback)
    needs: [build-web, build-admin, build-landing]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-convex
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          environment: ${{ inputs.environment }}

  # ─── Deploy apps ─────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web (Rollback)
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: web
          environment: ${{ needs.validate.outputs.vercel-env }}
          artifact-name: web-${{ needs.validate.outputs.vercel-env }}-${{ inputs.target_sha }}
          tarball: web-${{ needs.validate.outputs.vercel-env }}.tar.gz
          checksum-file: web-${{ needs.validate.outputs.vercel-env }}.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-web }}

  deploy-admin:
    name: Deploy Admin (Rollback)
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: admin
          environment: ${{ needs.validate.outputs.vercel-env }}
          artifact-name: admin-${{ needs.validate.outputs.vercel-env }}-${{ inputs.target_sha }}
          tarball: admin-${{ needs.validate.outputs.vercel-env }}.tar.gz
          checksum-file: admin-${{ needs.validate.outputs.vercel-env }}.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-admin }}

  deploy-landing:
    name: Deploy Landing (Rollback)
    needs: [validate, deploy-convex]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/deploy-vercel
        id: deploy
        with:
          app: landing
          environment: ${{ needs.validate.outputs.vercel-env }}
          artifact-name: landing-${{ needs.validate.outputs.vercel-env }}-${{ inputs.target_sha }}
          tarball: landing-${{ needs.validate.outputs.vercel-env }}.tar.gz
          checksum-file: landing-${{ needs.validate.outputs.vercel-env }}.tar.gz.sha256
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ needs.validate.outputs.project-id-landing }}

  # ─── Post-rollback ───────────────────────────────────────────────
  post-rollback:
    name: Post-Rollback Verification
    needs: [deploy-web, deploy-admin, deploy-landing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Health check all apps
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const apps = [
              { name: 'web', url: '${{ needs.deploy-web.outputs.deployment-url }}' },
              { name: 'admin', url: '${{ needs.deploy-admin.outputs.deployment-url }}' },
              { name: 'landing', url: '${{ needs.deploy-landing.outputs.deployment-url }}' },
            ];

            const results = [];
            for (const app of apps) {
              if (!app.url) {
                results.push(`❌ ${app.name}: No deployment URL`);
                continue;
              }
              try {
                const response = await fetch(app.url, {
                  method: 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000),
                });
                if (response.ok) {
                  results.push(`✅ ${app.name}: ${response.status} (${app.url})`);
                } else {
                  results.push(`⚠️ ${app.name}: ${response.status} (${app.url})`);
                }
              } catch (error) {
                results.push(`❌ ${app.name}: ${error.message}`);
              }
            }

            const summary = results.join('\n');
            console.log(summary);

            core.summary.addHeading('Rollback Health Checks', 3);
            core.summary.addCodeBlock(summary);
            await core.summary.write();

      - name: Create rollback tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          TAG="deploy/${{ inputs.environment }}/rollback/${TIMESTAMP}/${{ inputs.target_sha }}"
          git tag -a "${TAG}" "${{ inputs.target_sha }}" \
            -m "Rollback ${{ inputs.environment }} to ${{ inputs.target_sha }}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${TAG}"

          echo "### Rollback Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rolled back to:** ${{ inputs.target_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"
