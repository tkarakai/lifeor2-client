name: CI Web

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ============================================================
  # CHANGE DETECTION
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.act-all.outputs.should_run || steps.evaluate.outputs.should_run }}
    steps:
      - name: Run all jobs in act
        if: ${{ env.ACT }}
        id: act-all
        run: |
          echo "Running in act — skipping change detection"
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4

      - name: Detect file changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            backend:
              - 'packages/backend/**'
            design-system:
              - 'packages/design-system/**'
            auth:
              - 'packages/auth/**'
            root:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'scripts/**'

      - name: Evaluate changes
        if: ${{ !env.ACT }}
        id: evaluate
        run: |
          if [[ "${{ steps.filter.outputs.web }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.design-system }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.auth }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.root }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping web — no relevant changes"
          fi

  # ============================================================
  # UNIT & COMPONENT TESTS
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Run Bun tests
        run: cd apps/web && bun run test

      - name: Run Vitest with coverage
        run: cd apps/web && bun run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          JOB_DIR="/act-artifacts/web/test"
          if [ -n "$ACT" ]; then
            mkdir -p "$JOB_DIR"
            SUMMARY_FILE="$JOB_DIR/step-summary.md"
          else
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          fi
          COVERAGE_FILE="apps/web/qa/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "## Coverage Summary (web)" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "| Metric | Coverage |" >> "$SUMMARY_FILE"
            echo "|--------|----------|" >> "$SUMMARY_FILE"
            echo "| Lines | $(jq -r '.total.lines.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Branches | $(jq -r '.total.branches.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Functions | $(jq -r '.total.functions.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
            echo "| Statements | $(jq -r '.total.statements.pct' "$COVERAGE_FILE")% |" >> "$SUMMARY_FILE"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: coverage-report-web
          path: apps/web/qa/coverage/
          retention-days: 7

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/web/test"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/web/qa/coverage" ] && cp -r "apps/web/qa/coverage" "$JOB_DIR/artifacts/coverage-web" 2>/dev/null || true

  # ============================================================
  # BUILD & BUNDLE SIZE
  # ============================================================
  build:
    name: Build & Bundle Size
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bunx turbo build --filter=@repo/web...
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
          NEXT_PUBLIC_CONVEX_SITE_URL: "https://placeholder.convex.site"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3001"
          NEXT_PUBLIC_LANDING_URL: "http://localhost:3000"

      - name: Check bundle size
        run: cd apps/web && bun run size

  # ============================================================
  # E2E TESTS
  # ============================================================
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: vars.SKIP_E2E != 'true' && needs.changes.outputs.should_run == 'true' && github.event.pull_request.draft == false
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: apps/web

      # `convex dev` in anonymous mode downloads its local backend binary from
      # GitHub releases UNAUTHENTICATED. Four shards booting at once hit
      # "403 API rate limit exceeded" and the webServer never starts. Cache the
      # binary so at most the first run downloads it.
      - name: Cache Convex local backend
        uses: actions/cache@v4
        with:
          path: ~/.convex
          key: ${{ runner.os }}-convex-backend-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-convex-backend-

      # Each shard boots its own Convex backend via the Playwright webServer,
      # so auth rate-limit counters stay per-shard and workers stay at 1.
      - name: Run Playwright tests
        run: |
          # Stagger the shards: if the cache missed, this keeps four concurrent
          # Convex backend downloads from hitting GitHub's unauthenticated limit
          # at the same instant.
          sleep $(( (${{ matrix.shard }} - 1) * 20 ))
          cd apps/web && bunx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true

      - name: Show dev logs on failure
        if: failure()
        run: |
          echo "=== Convex Dev Log ==="
          cat .convex-dev.log 2>/dev/null || echo "No Convex log found"
          echo ""
          echo "=== Next.js Dev Log (web) ==="
          cat .next-web.log 2>/dev/null || echo "No Next.js log found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: blob-report-web-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 7

      - name: Upload visual snapshots
        uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: visual-snapshots-web-${{ matrix.shard }}
          path: apps/web/qa/e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save job outputs (act)
        if: ${{ always() && env.ACT }}
        run: |
          JOB_DIR="/act-artifacts/web/e2e/shard-${{ matrix.shard }}"
          mkdir -p "$JOB_DIR/artifacts"
          [ -d "apps/web/qa/playwright-report" ] && cp -r "apps/web/qa/playwright-report" "$JOB_DIR/artifacts/playwright-report-web" 2>/dev/null || true
          [ -d "apps/web/qa/e2e/__screenshots__" ] && cp -r "apps/web/qa/e2e/__screenshots__" "$JOB_DIR/artifacts/visual-snapshots-web" 2>/dev/null || true

  # ============================================================
  # MERGE SHARDED E2E REPORTS
  # ============================================================
  e2e-report:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: [changes, e2e]
    # NOTE: the `env` context is not available in a job-level `if` — using it
    # here makes GitHub reject the entire workflow file at parse time.
    if: ${{ always() && needs.e2e.result != 'skipped' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-web-*
          merge-multiple: true

      - name: Merge into HTML report
        run: cd apps/web && bunx playwright merge-reports --reporter=html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: qa/playwright-report

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-web
          path: apps/web/qa/playwright-report/
          retention-days: 7

  # ============================================================
  # SUMMARY
  # ============================================================
  ci-web-complete:
    name: CI Web Complete
    runs-on: ubuntu-latest
    needs: [changes, test, build, e2e]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Changes should_run: ${{ needs.changes.outputs.should_run }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E: ${{ needs.e2e.result }}"

          # If no relevant changes, all jobs are skipped — that's success
          if [[ "${{ needs.changes.outputs.should_run }}" != "true" ]]; then
            echo "No relevant changes — skipping web CI"
            exit 0
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test failed: ${{ needs.test.result }}"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed: ${{ needs.build.result }}"
            exit 1
          fi

          # E2E must succeed or be skipped (skipped for draft PRs)
          E2E="${{ needs.e2e.result }}"
          if [[ "$E2E" != "success" && "$E2E" != "skipped" ]]; then
            echo "E2E failed: $E2E"
            exit 1
          fi

          echo "All web CI jobs passed"
